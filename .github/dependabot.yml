# Please see the documentation for all configuration options:
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
    # Only send security updates, not general version updates.
    open-pull-requests-limit: 0
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    # Security updates only, matching the cargo entry above. Every pull request
    # here starts a full Windows build of the workspace, which is far more
    # compute than a routine action version bump is worth on this fork.
    open-pull-requests-limit: 0
