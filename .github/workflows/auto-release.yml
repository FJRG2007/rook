name: Auto release

# Cuts a release whenever main passes CI with app changes the last tag does not
# have. Releases used to be tagged by hand, and a month of fixes once sat on main
# with no installer to update to because nobody remembered to.
#
# The tag is pushed with GITHUB_TOKEN, and a push made with that token starts no
# workflow, so Release is started explicitly through workflow_dispatch - the one
# event GITHUB_TOKEN is allowed to trigger.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# One decision at a time, never cancelled: the second run sees the tag the first
# one pushed and stops there.
concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    name: Tag and start the release
    # A push to main from this repository that passed. Scheduled and pull request
    # runs check nothing new about what main ships.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Decide and tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          # Only the commit main points at now. An older one that passed is
          # superseded, and the newer commit's own CI run will decide for it.
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$TESTED" ]; then
            echo "main moved on to $head after $TESTED was tested; leaving it to that run"
            exit 0
          fi

          if git tag --points-at "$head" | grep -q '^v'; then
            echo "$head is already released"
            exit 0
          fi

          # The paths CI treats as unable to affect the build, plus .github: a
          # release of nothing but documentation or workflow changes would be a
          # new version of the same binary.
          last="$(git describe --tags --abbrev=0 --match 'v*' "$head")"
          unshipped='^(docs/.+|[^/]+[.]md|LICENSE[^/]*|[.]github/.+)$'
          if ! git diff --name-only "$last" "$head" | grep -qvE "$unshipped"; then
            echo "nothing that ships in the app since $last"
            exit 0
          fi

          tag="$(script/release_tag)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$tag" -m "Rook $tag" "$head"
          git push origin "$tag"
          gh workflow run release.yml --ref main -f tag="$tag"
          echo "::notice::released $tag ($(git rev-list --count "$last..$head") commits since $last)"
