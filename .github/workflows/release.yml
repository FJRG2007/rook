name: Release

# Rook has no release host of its own, so GitHub releases are the distribution
# channel. Push a `v*` tag (or run this by hand) and the Windows installer is
# built and attached to the release for that tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish (e.g. v0.1.0)
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-installer:
    name: Windows installer (${{ matrix.arch }})
    runs-on: windows-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        arch: [x64]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve release tag
        id: tag
        shell: bash
        run: echo "value=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: windows
          is_self_hosted: 'false'
          install_release_deps: 'true'

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          # ISCC is not on PATH after install, and it lands in one of two places
          # depending on whether the package installs per-machine or per-user.
          $iscc = Get-ChildItem -Path @(
              "${env:ProgramFiles(x86)}",
              "$env:ProgramFiles",
              "$env:LOCALAPPDATA\Programs"
            ) -Filter ISCC.exe -Recurse -Depth 3 -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe not found after installing Inno Setup' }
          $iscc.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Unsigned: code-signing needs a certificate this repository does not hold.
      # Windows SmartScreen will warn on first run; see docs/INSTALL.md.
      - name: Build installer
        shell: pwsh
        run: |
          .\script\windows\bundle.ps1 `
            -CHANNEL oss `
            -ARCH ${{ matrix.arch }} `
            -RELEASE_TAG ${{ steps.tag.outputs.value }}

      - name: Locate installer
        id: installer
        shell: bash
        run: |
          path=$(ls script/windows/Output/*.exe | head -1)
          if [ -z "$path" ]; then
            echo "::error::bundle.ps1 produced no installer in script/windows/Output"
            exit 1
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: rook-windows-${{ matrix.arch }}
          path: ${{ steps.installer.outputs.path }}

      - name: Publish to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          files: ${{ steps.installer.outputs.path }}
          fail_on_unmatched_files: true
          generate_release_notes: true
