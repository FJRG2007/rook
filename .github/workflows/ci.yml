name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lints:
    name: Formatting + Clippy
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: windows
          is_self_hosted: 'false'

      - name: Check formatting
        shell: bash
        run: cargo fmt --all -- --check

      - name: Clippy
        shell: bash
        # The two excluded crates do not build on Windows: rook_js targets wasm,
        # and command-signatures-v2 needs the JS toolchain built first.
        # `--all-features` is omitted because pprof and the other profiling
        # features do not compile here either.
        run: |
          cargo clippy --locked --workspace \
            --exclude rook_js --exclude command-signatures-v2 \
            --all-targets --tests -- -D warnings

  test:
    name: Tests
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: windows
          is_self_hosted: 'false'
          install_test_deps: 'true'

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Run tests
        shell: bash
        # The integration package drives a real window and is not run on Windows
        # upstream either; command-signatures-v2 needs its JS build first.
        run: |
          cargo nextest run --workspace --locked \
            --exclude command-signatures-v2 \
            -E "not package(integration)"

  build:
    name: Release build
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: windows
          is_self_hosted: 'false'

      - name: Build
        shell: bash
        run: cargo build --release --bin rook-oss --features release_bundle,gui
