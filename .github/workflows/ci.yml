name: CI

# Deliberately unfiltered. A `paths-ignore` here would not report the jobs
# below as passed on a documentation-only change - it would stop the workflow
# from starting at all, so their checks are never created. Under branch
# protection a required check that does not exist sits at "Expected - waiting
# for status to be reported" and blocks the merge, and anything else waiting on
# CI for that commit waits for a run that will never appear. The filter lives in
# the `changes` job instead, where it saves the runner time without taking the
# check names away.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded runs are cancelled on every branch, main included. CI publishes
  # nothing, so an older run has no value once a newer commit exists, and
  # letting it finish only makes the run that matters queue behind it for the
  # better part of an hour. Release keeps the opposite setting, because
  # cancelling a half-finished release build would leave the tag without an
  # installer.
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Incremental compilation only pays off across edits on one machine. In CI it
  # is dead weight in the build and in the cache that carries it between runs.
  CARGO_INCREMENTAL: 0
  # Carries fail-fast = false and immediate failure output; see
  # .config/nextest.toml.
  NEXTEST_PROFILE: ci

jobs:
  # Whether the rest of the workflow has anything to do. Every job below still
  # runs and still reports, it just skips its steps when nothing outside
  # documentation changed.
  changes:
    name: Detect changes outside documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Compare the range being checked
        id: filter
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          # Any range that cannot be resolved - a manual dispatch, the first
          # push of a branch, a comparison the API will not return - runs
          # everything. This exists to save runner time, never to decide
          # whether something is worth checking.
          if [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The comparison is one page, so a large one reports as changed
          # rather than pretending to have seen every file in it.
          query='(.files // []) | if length >= 300 then "truncated" else .[].filename end'
          if ! files=$(gh api "repos/$REPOSITORY/compare/$BASE...$HEAD" --jq "$query"); then
            echo 'code=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The paths that provably cannot affect the build or the tests. Note
          # what is NOT here: resources/** and plugins/** hold bundled skills
          # whose markdown the tests read and assert on, so a "docs only" rule
          # matching every .md would skip the run that catches a broken one.
          # That is not hypothetical - it is how a missing
          # references/scorers.md reached main.
          #
          # An empty comparison leaves one empty line, which matches nothing
          # and so runs everything - the safe direction.
          documentation='^(docs/.+|[^/]+[.]md|LICENSE[^/]*|[.]github/ISSUE_TEMPLATE/.+)$'
          if echo "$files" | grep -qvE "$documentation"; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
          else
            echo 'code=false' >> "$GITHUB_OUTPUT"
          fi

  lints:
    name: Formatting + Clippy (${{ matrix.name }})
    needs: changes
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            name: Windows
            runner: windows-latest
            # rook_js targets wasm and command-signatures-v2 needs its JS
            # toolchain built first, so neither builds here.
            clippy_excludes: --exclude rook_js --exclude command-signatures-v2
          - os: macos
            name: macOS
            runner: macos-latest
            clippy_excludes: --exclude rook_completer
          - os: linux
            name: Linux
            runner: ubuntu-latest
            clippy_excludes: --exclude rook_completer
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code == 'true'

      - uses: ./.github/actions/prepare_environment
        if: needs.changes.outputs.code == 'true'
        with:
          target_os: ${{ matrix.os }}
          is_self_hosted: 'false'
          # One cache per build mode. Clippy runs in check mode, so its
          # dependencies land as .rmeta with no codegen - useless to the test
          # job, which needs the rlibs. Sharing a key with it only made the two
          # jobs race for the same entry, and rust-cache does not re-save after
          # an exact hit, so whichever won left the other permanently cold.
          cache_key: ${{ matrix.os }}-check

      - name: Check formatting
        if: needs.changes.outputs.code == 'true' && matrix.os == 'linux'
        # Formatting is platform independent, so one job is enough.
        shell: bash
        run: cargo fmt --all -- --check

      - name: Clippy
        if: needs.changes.outputs.code == 'true'
        shell: bash
        # `--all-features` is omitted: pprof and the other profiling features do
        # not compile on every target.
        run: |
          cargo clippy --locked --workspace ${{ matrix.clippy_excludes }} \
            --all-targets --tests -- -D warnings

  test:
    name: Tests (${{ matrix.name }})
    needs: changes
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            name: Windows
            runner: windows-latest
            test_excludes: --exclude command-signatures-v2 --exclude rook_js
          - os: macos
            name: macOS
            runner: macos-latest
            test_excludes: --exclude command-signatures-v2
          - os: linux
            name: Linux
            runner: ubuntu-latest
            test_excludes: --exclude command-signatures-v2
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code == 'true'

      - uses: ./.github/actions/prepare_environment
        if: needs.changes.outputs.code == 'true'
        with:
          target_os: ${{ matrix.os }}
          is_self_hosted: 'false'
          install_test_deps: 'true'
          cache_key: ${{ matrix.os }}-test

      - name: Install cargo-nextest
        if: needs.changes.outputs.code == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # The Linux job keeps being killed with exit 143 - "the runner has received
      # a shutdown signal" - minutes into the build, with no output in between and
      # nothing logged when a runner is reclaimed that way. Two guesses have been
      # wrong: it is not `serve-wasm` (excluding it only moved the kill to the
      # crate before), and it is not build concurrency (`CARGO_BUILD_JOBS=2` made
      # it die sooner). The starting figures rule out the easy answers - 78G free
      # disk, 13G available of 15G, 4 cores, swap untouched - so the remaining
      # question is what the machine does during the build, which needs sampling
      # rather than a snapshot.
      - name: Report runner resources
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: |
          df -h . || true
          free -h || true
          nproc || true

      - name: Run tests
        if: needs.changes.outputs.code == 'true'
        shell: bash
        # `serve-wasm` is excluded from the build, not just from the run:
        # `Cargo.toml` keeps it out of `default-members` because it is a helper
        # for serving wasm binaries, it carries no tests at all, and
        # `--workspace` overrides `default-members` and pulls it back in, so
        # all three test jobs compiled it for nothing. It is what the Linux
        # runner was building when it was killed at 8m30s.
        #
        # `integration` is filtered rather than excluded, even though it is
        # equally never run here, because `--exclude integration` does more
        # than skip a package: `crates/integration` is the only thing that
        # depends on `rook` with `features = ["integration_tests"]`, so
        # excluding it drops that feature from the unit-test build of `rook`
        # itself. That flips every `cfg!(feature = "integration_tests")` branch
        # under the other 11,300 tests - `SUBSHELL_BANNER_DELAY_DURATION` alone
        # goes from zero to a real wall-clock second - and `lints` would not
        # catch it, because that job does not exclude the package and so still
        # builds `rook` with the feature on.
        #
        # --no-fail-fast because the default stops at the first failure: one
        # broken test hid the other 10,700 and made each fix another round trip.
        run: |
          # Report what the machine is doing every 15 seconds for as long as the
          # build runs. The kill leaves no trace of its own, so without this the
          # last thing in the log is a `Compiling` line from minutes earlier and
          # every explanation is inference. Cheap, and it only has to survive
          # until the question is answered.
          # Measured: two rustc processes reach 7.3G and 7.0G, 14.2G of the 15G this
          # runner has, with all 3G of swap consumed - then the service reclaims it.
          # `CARGO_BUILD_JOBS=2` is why there are two rather than four, but capping
          # how many run says nothing about how large each gets, so the peak has to
          # come down instead. Debug info is the cheapest part to give up here:
          # `#[track_caller]` panic locations are compiled in regardless, so a
          # failing test still names its file and line - only the symbolicated
          # backtrace below it is lost, and only on this platform.
          if [ "${{ matrix.os }}" = "linux" ]; then
            export CARGO_BUILD_JOBS=2
            export CARGO_PROFILE_DEV_DEBUG=0

            (
              while :; do
                printf '[resources] %s %s | %s\n' \
                  "$(date -u +%H:%M:%S)" \
                  "$(free -m | awk '/^Mem:/ {printf "used=%sM avail=%sM", $3, $7} /^Swap:/ {printf " swap=%sM", $3}')" \
                  "$(ps -eo rss,comm --sort=-rss | awk 'NR>1 && NR<5 {printf "%s=%dM ", $2, $1/1024}')"
                sleep 15
              done
            ) &
            resource_monitor=$!
            trap 'kill "$resource_monitor" 2>/dev/null || true' EXIT
          fi
          cargo nextest run --workspace --locked --no-fail-fast \
            --exclude serve-wasm \
            ${{ matrix.test_excludes }} \
            -E "not package(integration)"

  release-check:
    name: Release profile compiles (${{ matrix.name }})
    needs: changes
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            name: Windows
            runner: windows-latest
          - os: macos
            name: macOS
            runner: macos-latest
          - os: linux
            name: Linux
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code == 'true'

      - uses: ./.github/actions/prepare_environment
        if: needs.changes.outputs.code == 'true'
        with:
          target_os: ${{ matrix.os }}
          is_self_hosted: 'false'
          # Not the plain `-rlto` key release.yml uses. This job only checks,
          # so its dependencies are .rmeta the tag build cannot link against,
          # and sharing the entry would leave the tag build restoring a cache
          # it cannot use and unable to save the one it could.
          cache_key: ${{ matrix.os }}-rlto-check

      # Only the release profile and its feature set are verified here, and
      # `cargo check` establishes that without paying for codegen and LTO. The
      # tag build in release.yml produces the binaries.
      - name: Check release compilation (Windows)
        if: needs.changes.outputs.code == 'true' && matrix.os == 'windows'
        shell: pwsh
        run: .\script\windows\bundle.ps1 -CHANNEL oss -ARCH x64 -CHECK_ONLY

      - name: Check release compilation (Unix)
        if: needs.changes.outputs.code == 'true' && matrix.os != 'windows'
        shell: bash
        run: |
          cargo check --locked -p rook --profile rlto \
            --bin rook-oss --features release_bundle,gui
