name: CI

# Deliberately unfiltered. A `paths-ignore` here would not report the jobs
# below as passed on a documentation-only change - it would stop the workflow
# from starting at all, so their checks are never created. Under branch
# protection a required check that does not exist sits at "Expected - waiting
# for status to be reported" and blocks the merge, and anything else waiting on
# CI for that commit waits for a run that will never appear. The filter lives in
# the `changes` job instead, where it saves the runner time without taking the
# check names away.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded runs are cancelled on every branch, main included. CI publishes
  # nothing, so an older run has no value once a newer commit exists, and
  # letting it finish only makes the run that matters queue behind it for the
  # better part of an hour. Release keeps the opposite setting, because
  # cancelling a half-finished release build would leave the tag without an
  # installer.
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Incremental compilation only pays off across edits on one machine. In CI it
  # is dead weight in the build and in the cache that carries it between runs.
  CARGO_INCREMENTAL: 0
  # Carries fail-fast = false and immediate failure output; see
  # .config/nextest.toml.
  NEXTEST_PROFILE: ci

jobs:
  # Whether the rest of the workflow has anything to do. Every job below still
  # runs and still reports, it just skips its steps when nothing outside
  # documentation changed.
  changes:
    name: Detect changes outside documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Compare the range being checked
        id: filter
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          # Any range that cannot be resolved - a manual dispatch, the first
          # push of a branch, a comparison the API will not return - runs
          # everything. This exists to save runner time, never to decide
          # whether something is worth checking.
          if [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The comparison is one page, so a large one reports as changed
          # rather than pretending to have seen every file in it.
          query='(.files // []) | if length >= 300 then "truncated" else .[].filename end'
          if ! files=$(gh api "repos/$REPOSITORY/compare/$BASE...$HEAD" --jq "$query"); then
            echo 'code=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The paths that provably cannot affect the build or the tests. Note
          # what is NOT here: resources/** and plugins/** hold bundled skills
          # whose markdown the tests read and assert on, so a "docs only" rule
          # matching every .md would skip the run that catches a broken one.
          # That is not hypothetical - it is how a missing
          # references/scorers.md reached main.
          #
          # An empty comparison leaves one empty line, which matches nothing
          # and so runs everything - the safe direction.
          documentation='^(docs/.+|[^/]+[.]md|LICENSE[^/]*|[.]github/ISSUE_TEMPLATE/.+)$'
          if echo "$files" | grep -qvE "$documentation"; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
          else
            echo 'code=false' >> "$GITHUB_OUTPUT"
          fi

  lints:
    name: Formatting + Clippy (${{ matrix.name }})
    needs: changes
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            name: Windows
            runner: windows-latest
            # rook_js targets wasm and command-signatures-v2 needs its JS
            # toolchain built first, so neither builds here.
            clippy_excludes: --exclude rook_js --exclude command-signatures-v2
          - os: macos
            name: macOS
            runner: macos-latest
            clippy_excludes: --exclude rook_completer
          - os: linux
            name: Linux
            runner: ubuntu-latest
            clippy_excludes: --exclude rook_completer
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code == 'true'

      - uses: ./.github/actions/prepare_environment
        if: needs.changes.outputs.code == 'true'
        with:
          target_os: ${{ matrix.os }}
          is_self_hosted: 'false'
          # One cache per build mode. Clippy runs in check mode, so its
          # dependencies land as .rmeta with no codegen - useless to the test
          # job, which needs the rlibs. Sharing a key with it only made the two
          # jobs race for the same entry, and rust-cache does not re-save after
          # an exact hit, so whichever won left the other permanently cold.
          cache_key: ${{ matrix.os }}-check

      - name: Check formatting
        if: needs.changes.outputs.code == 'true' && matrix.os == 'linux'
        # Formatting is platform independent, so one job is enough.
        shell: bash
        run: cargo fmt --all -- --check

      - name: Clippy
        if: needs.changes.outputs.code == 'true'
        shell: bash
        # `--all-features` is omitted: pprof and the other profiling features do
        # not compile on every target.
        run: |
          cargo clippy --locked --workspace ${{ matrix.clippy_excludes }} \
            --all-targets --tests -- -D warnings

  test:
    name: Tests (${{ matrix.name }})
    needs: changes
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            name: Windows
            runner: windows-latest
            test_excludes: --exclude command-signatures-v2 --exclude rook_js
          - os: macos
            name: macOS
            runner: macos-latest
            test_excludes: --exclude command-signatures-v2
          - os: linux
            name: Linux
            runner: ubuntu-latest
            test_excludes: --exclude command-signatures-v2
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code == 'true'

      - uses: ./.github/actions/prepare_environment
        if: needs.changes.outputs.code == 'true'
        with:
          target_os: ${{ matrix.os }}
          is_self_hosted: 'false'
          install_test_deps: 'true'
          cache_key: ${{ matrix.os }}-test

      - name: Install cargo-nextest
        if: needs.changes.outputs.code == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Run tests
        if: needs.changes.outputs.code == 'true'
        shell: bash
        # Excluded from the build, not just from the run. `Cargo.toml` keeps
        # both out of `default-members` precisely because neither is meant to
        # be regularly compiled: `serve-wasm` is a helper for serving wasm
        # binaries and carries no tests at all, and `integration` drives a
        # real window and is not run in CI upstream either. `--workspace`
        # overrides `default-members` and pulls both back in, so filtering
        # `integration` out with `-E` stopped its tests running while still
        # paying to compile it, and `serve-wasm` was compiled on every test
        # job for nothing - it is what the Linux runner was building when it
        # was killed at 8m30s. Neither stops being checked: the `lints` job
        # still compiles and lints the whole workspace with
        # `--all-targets --tests`.
        #
        # --no-fail-fast because the default stops at the first failure: one
        # broken test hid the other 10,700 and made each fix another round trip.
        run: |
          cargo nextest run --workspace --locked --no-fail-fast \
            --exclude serve-wasm --exclude integration \
            ${{ matrix.test_excludes }}

  release-check:
    name: Release profile compiles (${{ matrix.name }})
    needs: changes
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            name: Windows
            runner: windows-latest
          - os: macos
            name: macOS
            runner: macos-latest
          - os: linux
            name: Linux
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code == 'true'

      - uses: ./.github/actions/prepare_environment
        if: needs.changes.outputs.code == 'true'
        with:
          target_os: ${{ matrix.os }}
          is_self_hosted: 'false'
          # Not the plain `-rlto` key release.yml uses. This job only checks,
          # so its dependencies are .rmeta the tag build cannot link against,
          # and sharing the entry would leave the tag build restoring a cache
          # it cannot use and unable to save the one it could.
          cache_key: ${{ matrix.os }}-rlto-check

      # Only the release profile and its feature set are verified here, and
      # `cargo check` establishes that without paying for codegen and LTO. The
      # tag build in release.yml produces the binaries.
      - name: Check release compilation (Windows)
        if: needs.changes.outputs.code == 'true' && matrix.os == 'windows'
        shell: pwsh
        run: .\script\windows\bundle.ps1 -CHANNEL oss -ARCH x64 -CHECK_ONLY

      - name: Check release compilation (Unix)
        if: needs.changes.outputs.code == 'true' && matrix.os != 'windows'
        shell: bash
        run: |
          cargo check --locked -p rook --profile rlto \
            --bin rook-oss --features release_bundle,gui
