name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded runs are cancelled on every branch, main included. CI publishes
  # nothing, so an older run has no value once a newer commit exists, and
  # letting it finish only makes the run that matters queue behind it for the
  # better part of an hour. Release keeps the opposite setting, because
  # cancelling a half-finished release build would leave the tag without an
  # installer.
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lints:
    name: Formatting + Clippy
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: windows
          is_self_hosted: 'false'
          # Shares the dev-profile cache with the test job; a single key across
          # every job just meant they overwrote each other and all started cold.
          cache_key: windows-dev

      - name: Check formatting
        shell: bash
        run: cargo fmt --all -- --check

      - name: Clippy
        shell: bash
        # The two excluded crates do not build on Windows: rook_js targets wasm,
        # and command-signatures-v2 needs the JS toolchain built first.
        # `--all-features` is omitted because pprof and the other profiling
        # features do not compile here either.
        run: |
          cargo clippy --locked --workspace \
            --exclude rook_js --exclude command-signatures-v2 \
            --all-targets --tests -- -D warnings

  test:
    name: Tests
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: windows
          is_self_hosted: 'false'
          install_test_deps: 'true'
          cache_key: windows-dev

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Run tests
        shell: bash
        # The integration package drives a real window and is not run on Windows
        # upstream either; command-signatures-v2 needs its JS build first.
        run: |
          cargo nextest run --workspace --locked \
            --exclude command-signatures-v2 \
            -E "not package(integration)"

  release-check:
    name: Release profile compiles
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: windows
          is_self_hosted: 'false'
          cache_key: windows-rlto

      # Only the release profile and its feature set are being verified here,
      # and `cargo check` establishes that without paying for codegen and LTO.
      # The tag build in release.yml is what actually produces a binary, and it
      # now reuses the cache this job leaves behind.
      - name: Check release compilation
        shell: pwsh
        run: .\script\windows\bundle.ps1 -CHANNEL oss -ARCH x64 -CHECK_ONLY
