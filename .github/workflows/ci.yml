name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lints:
    name: Formatting + Clippy
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: windows
          is_self_hosted: 'false'

      - name: Check formatting
        shell: bash
        run: cargo fmt --all -- --check

      - name: Clippy
        shell: bash
        # `--all-features` is omitted on Windows because pprof and the other
        # profiling features do not compile there.
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Tests
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: windows
          is_self_hosted: 'false'
          install_test_deps: 'true'

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Run tests
        shell: bash
        run: cargo nextest run --workspace --no-fail-fast

  build:
    name: Release build
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: windows
          is_self_hosted: 'false'

      - name: Build
        shell: bash
        run: cargo build --release --bin rook-oss --features release_bundle,gui
